<!doctype html>
<html lang="en">
  <head>
    <title>to do list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stat">
      <div class="icon">
        <img src="/Project to do list/assets/checkup-list.svg" />
      </div>
      <p>Done list:</p>
      <p id="donecount">0</p>
    </div>
    <div class="header"><h1>To do list</h1></div>
    <div class="input">
      <textarea
        type="text"
        id="todoInput"
        placeholder="What do you want to do?"
      ></textarea>
      <button id="add" class="add">+</button>
    </div>
    <div class="todolist" id="todoList"></div>
    <script src="main.js"></script>
  </body>
</html>
